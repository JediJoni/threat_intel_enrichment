[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "threat-intel-enrichment"
version = "0.1.0"
description = "Defensive threat-intelligence enrichment and explainable risk-scoring pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [
    { name = "Jonas Korganas", email = "korganasjonas@gmail.com" }
]
dependencies = [
    "pandas>=2.2,<3.0",
    "pyarrow>=16,<22",
    "pydantic>=2.7,<3.0",
    "python-dotenv>=1.0,<2.0",
    "rich>=13.7,<15.0",
    "tldextract>=5.1,<6.0",
    "typer>=0.12,<1.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10,<2.0",
    "pandas-stubs>=2.2",
    "pytest>=8.2,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.5,<1.0",
]

[project.scripts]
threat-intel-enrichment = "threat_intel_enrichment.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/threat_intel_enrichment"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["threat_intel_enrichment"]
mypy_path = "src"
